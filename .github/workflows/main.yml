name: "FAISAL JAVED | IDEAL-TECH | Windows RDP"

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    name: "FAISAL JAVED | @IDEAL-TECH RDP"
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Original RDP settings retained from the user's first workflow.
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Apply Local Password Policy for Requested Password
        run: |
          # The requested password "faisaljvd" is 9 characters but contains
          # lowercase letters only. Windows password complexity may reject it.
          # Attempt to relax the RUNNER'S LOCAL password policy before creating
          # the local RDP account. A domain-enforced policy may still override this.
          $policyFile = Join-Path $env:TEMP "ideal-tech-secpol.inf"
          $dbFile = Join-Path $env:TEMP "ideal-tech-secpol.sdb"

          secedit.exe /export /cfg $policyFile | Out-Null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $policyFile)) {
              throw "Could not export local security policy."
          }

          $policy = Get-Content $policyFile -Raw

          if ($policy -match '(?m)^PasswordComplexity\s*=') {
              $policy = [regex]::Replace($policy, '(?m)^PasswordComplexity\s*=.*$', 'PasswordComplexity = 0')
          } else {
              $policy += "`r`nPasswordComplexity = 0`r`n"
          }

          if ($policy -match '(?m)^MinimumPasswordLength\s*=') {
              $policy = [regex]::Replace($policy, '(?m)^MinimumPasswordLength\s*=.*$', 'MinimumPasswordLength = 8')
          } else {
              $policy += "`r`nMinimumPasswordLength = 8`r`n"
          }

          if ($policy -match '(?m)^PasswordHistorySize\s*=') {
              $policy = [regex]::Replace($policy, '(?m)^PasswordHistorySize\s*=.*$', 'PasswordHistorySize = 0')
          } else {
              $policy += "`r`nPasswordHistorySize = 0`r`n"
          }

          Set-Content -Path $policyFile -Value $policy -Encoding Unicode
          secedit.exe /configure /db $dbFile /cfg $policyFile /areas SECURITYPOLICY
          if ($LASTEXITCODE -ne 0) {
              throw "Could not apply local password policy. A domain policy may be enforcing stronger requirements."
          }

      - name: Create IDEAL-TECH RDP User
        run: |
          $username = "RDP"
          $password = "faisaljvd"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if (-not $existingUser) {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires `
                -Description "Faisal Javed | @IDEAL-TECH"
          } else {
              Set-LocalUser -Name $username -Password $securePass
          }

          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name $username)) {
              throw "RDP user creation failed."
          }

          "RDP_CREDS=User: $username | Password: $password" >> $env:GITHUB_ENV
          Write-Host "RDP account created/updated for FAISAL JAVED | @IDEAL-TECH."

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTHKEY }} `
            --hostname=ideal-tech-faisal-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "=========================================="
          Write-Host "       FAISAL JAVED | @IDEAL-TECH"
          Write-Host "=========================================="
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }

          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection + Watch RDP User
        run: |
          Write-Host ""
          Write-Host "================================================"
          Write-Host "          FAISAL JAVED | @IDEAL-TECH"
          Write-Host "================================================"
          Write-Host "          WINDOWS REMOTE DESKTOP"
          Write-Host "------------------------------------------------"
          Write-Host "Owner    : Faisal Javed"
          Write-Host "Brand    : @IDEAL-TECH"
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : RDP"
          Write-Host "Password : [configured as requested]"
          Write-Host "------------------------------------------------"
          Write-Host "          Powered by IDEAL-TECH"
          Write-Host "================================================"

          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"

          while ($true) {
              if (Test-Path $rdpProfile) {
                  try {
                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }

                      Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
                      Write-Host "Downloads.bat copied to $downloadPath"

                      cmd /c $downloadPath
                      Write-Host "Downloads.bat execution completed."
                      break
                  }
                  catch {
                      Write-Host "Error copying or executing Downloads.bat: $($_.Exception.Message)"
                      break
                  }
              }
              else {
                  Write-Host "[$(Get-Date)] Waiting for RDP profile to be created..."
                  Start-Sleep -Seconds 30
              }
          }

          while ($true) {
              Write-Host "[$(Get-Date)] FAISAL JAVED | @IDEAL-TECH - RDP Active"
              Start-Sleep -Seconds 300
          }

# RDP LOGIN DETAILS
# Username: RDP
# Password: faisaljvd
# Brand: FAISAL JAVED | @IDEAL-TECH
# Address: TAILSCALE_IP:3389 (shown in workflow logs)
#
# Required GitHub repository secret: TAILSCALE_AUTHKEY
#
# IMPORTANT:
# This workflow attempts to relax the runner's LOCAL password complexity
# policy to permit the requested lowercase-only password. If an organization
# or domain policy enforces password complexity, the requested password may
# still be rejected; use a password that meets that policy in that case.
#
# SECURITY:
# The original firewall rule allows TCP 3389 from any source. Use only in a
# trusted/isolated test environment. The requested fixed password is weak and
# is included in this file; keep the file private. GitHub-hosted runners are
# temporary and stop when the job ends or reaches its timeout.
